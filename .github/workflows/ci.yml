name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check build_table_copy.js

      - name: Page and manifest
        run: |
          grep -q 'src="./build_table_copy.js"' index.html
          grep -q 'src="./js/tableau.extensions.1.latest.js"' index.html
          test -f js/tableau.extensions.1.latest.js
          grep -q '<source-location>' Export.trex
